name: CI & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Kext
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies & Compatibility Paths
        run: |
          if [ ! -d "MacKernelSDK/Headers" ]; then
            git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK
          fi
          if [ ! -d "Lilu/Lilu/Headers" ]; then
            git clone --depth 1 https://github.com/acidanthera/Lilu.git Lilu
          fi
          mkdir -p Lilu.kext/Contents/Resources
          ln -sfn ../../../Lilu/Lilu/Headers Lilu.kext/Contents/Resources/Headers
          ln -sfn ../../../Lilu/Lilu/Library Lilu.kext/Contents/Resources/Library

      - name: Build Debug & Release
        run: |
          xcodebuild -project BFixup.xcodeproj -scheme BFixup -configuration Debug -derivedDataPath build_debug CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project BFixup.xcodeproj -scheme BFixup -configuration Release -derivedDataPath build_release CODE_SIGNING_ALLOWED=NO build

      - name: Package Kexts
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            RAW_TAG="latest"
          fi
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RAW_TAG=${RAW_TAG}" >> $GITHUB_ENV

          mkdir -p artifacts
          find build_release -name ".DS_Store" -delete
          find build_debug -name ".DS_Store" -delete

          cd build_release/Build/Products/Release
          zip -qry -X "../../../../artifacts/BFixup-${VERSION}-RELEASE.zip" "BFixup.kext"
          cd -

          cd build_debug/Build/Products/Debug
          zip -qry -X "../../../../artifacts/BFixup-${VERSION}-DEBUG.zip" "BFixup.kext"
          cd -

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c "
          import re, os
          tag = os.environ.get('VERSION', '').strip()
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'## \[?{re.escape(tag)}\]?[^\n]*\n(.*?)(?=\n## |\Z)'
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else f'Release {tag}'
          except Exception:
              notes = f'Release {tag}'
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
              f.write(notes + '\n')
          "

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BFixup-kexts
          path: artifacts/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BFixup ${{ env.RAW_TAG }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

